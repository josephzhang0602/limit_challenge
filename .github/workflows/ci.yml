name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_focused/backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend_focused/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the configuration
        run: python manage.py check

      - name: Check that no migration is missing
        run: python manage.py makemigrations --check --dry-run

      - name: Check that the API documentation can be generated
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml

      - name: Run the tests
        run: python manage.py test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_focused/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # The version that created package-lock.json. npm 10 (Node 22) reads
          # its optional peer dependencies differently and refuses the file.
          node-version-file: backend_focused/frontend/.nvmrc
          cache: npm
          cache-dependency-path: backend_focused/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check the formatting
        run: npm run format

      - name: Check the types
        run: npm run typecheck

      - name: Run the tests
        run: npm test

      - name: Build
        run: npm run build
